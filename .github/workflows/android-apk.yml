name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish the APK as a GitHub Release'
        type: boolean
        default: true
  push:
    tags: ['v*']

# needed to create the GitHub Release
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - name: Build web app for Android (relative paths)
        run: npm run build:android
        env:
          CAP_BUILD: '1'
      - name: Add Android project if missing, then sync
        run: |
          [ -d android ] || npx cap add android
          npx @capacitor/assets generate --android --assetPath assets
          npx cap sync android

      # Makes ChessLens appear in Android's Share sheet (Chess.com -> Export PGN -> ChessLens)
      - name: Add Share-sheet support
        run: |
          MAIN=$(find android/app/src/main/java -name MainActivity.java | head -1)
          DIR=$(dirname "$MAIN")
          PKG=$(grep -m1 '^package ' "$MAIN" | sed 's/package \(.*\);/\1/')
          echo "MainActivity: $MAIN  package: $PKG"

          cat > "$DIR/SharePlugin.java" <<JAVA
          package $PKG;

          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;

          @CapacitorPlugin(name = "SharedText")
          public class SharePlugin extends Plugin {
              private static String pending = null;
              private static SharePlugin instance = null;

              @Override
              public void load() { instance = this; }

              static String readUri(Context ctx, Uri uri) {
                  try (InputStream in = ctx.getContentResolver().openInputStream(uri);
                       ByteArrayOutputStream out = new ByteArrayOutputStream()) {
                      if (in == null) return null;
                      byte[] buf = new byte[8192];
                      int n, total = 0;
                      while ((n = in.read(buf)) > 0 && total < 2000000) { out.write(buf, 0, n); total += n; }
                      return out.toString("UTF-8");
                  } catch (Exception e) { return null; }
              }

              /** Called by MainActivity for every incoming intent. */
              static void handle(Context ctx, Intent intent) {
                  if (intent == null) return;
                  String action = intent.getAction();
                  String text = null;
                  if (Intent.ACTION_SEND.equals(action)) {
                      text = intent.getStringExtra(Intent.EXTRA_TEXT);
                      if (text == null || text.trim().isEmpty()) {
                          Uri uri = (Uri) intent.getParcelableExtra(Intent.EXTRA_STREAM);
                          if (uri != null) text = readUri(ctx, uri);
                      }
                  } else if (Intent.ACTION_VIEW.equals(action) && intent.getData() != null) {
                      text = readUri(ctx, intent.getData());
                  }
                  boolean shared = Intent.ACTION_SEND.equals(action) || Intent.ACTION_VIEW.equals(action);
                  if (text == null || text.trim().isEmpty()) {
                      if (!shared) return;
                      text = "__UNREADABLE__";
                  }
                  pending = text;
                  if (instance != null) {
                      JSObject o = new JSObject();
                      o.put("text", text);
                      instance.notifyListeners("sharedText", o, true);
                  }
              }

              @PluginMethod
              public void getPending(PluginCall call) {
                  JSObject r = new JSObject();
                  r.put("text", pending == null ? "" : pending);
                  pending = null;
                  call.resolve(r);
              }
          }
          JAVA

          cat > "$MAIN" <<JAVA
          package $PKG;

          import android.content.Intent;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(SharePlugin.class);
                  super.onCreate(savedInstanceState);
                  if (savedInstanceState == null) SharePlugin.handle(this, getIntent());
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  SharePlugin.handle(this, intent);
              }
          }
          JAVA

          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          if 'android.intent.action.SEND' not in s:
              filters = '''
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/*" />
                          <data android:mimeType="application/*" />
                          <data android:mimeType="*/*" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="content" />
                          <data android:scheme="file" />
                          <data android:mimeType="application/x-chess-pgn" />
                          <data android:mimeType="application/vnd.chess-pgn" />
                          <data android:mimeType="application/pgn" />
                          <data android:mimeType="text/plain" />
                          <data android:mimeType="application/octet-stream" />
                      </intent-filter>'''
              i = s.index('</intent-filter>') + len('</intent-filter>')
              s = s[:i] + filters + s[i:]
              open(p, 'w', encoding='utf-8').write(s)
          print('manifest ok:', 'android.intent.action.SEND' in s)
          PY

      # The coach's voice in the app uses the phone's text-to-speech. Android 11+ only lets an app see the
      # text-to-speech service when the manifest asks for it; without this the coach stays silent.
      - name: Allow text-to-speech (coach voice)
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          if 'android.intent.action.TTS_SERVICE' not in s:
              q = '''
              <queries>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>
          '''
              i = s.rindex('</manifest>')
              s = s[:i] + q + s[i:]
              open(p, 'w', encoding='utf-8').write(s)
          print('tts queries ok:', 'android.intent.action.TTS_SERVICE' in s)
          PY

      # Every build is signed with the SAME key (android-kit/signing), so a new release installs over the old one
      # and keeps your saved games. (The runner would otherwise make a new random key each time, and Android
      # refuses an update signed with a different key.) It is a debug key, not a Play Store key.
      - name: Use the app's fixed signing key
        run: mkdir -p ~/.android && cp android-kit/signing/chesslens-debug.keystore ~/.android/debug.keystore

      # Version shown in Android's app info: 1.<build number>
      - name: Set the app version
        run: |
          G=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" $G
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" $G
          grep -E "versionCode|versionName" $G

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ChessLens-1.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ChessLens-debug-apk
          path: ChessLens-1.${{ github.run_number }}.apk

      - name: Publish a GitHub Release
        if: github.event_name == 'push' || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=android-v1.${{ github.run_number }}
          gh release create "$TAG" "ChessLens-1.${{ github.run_number }}.apk" \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "ChessLens for Android 1.${{ github.run_number }}" \
            --notes "Android app (own design: dark, mint green, lime). Download ChessLens-1.${{ github.run_number }}.apk below and open it on your phone (allow installing from this source if asked).

          From this version on, every release is signed with the same key, so new versions install over the old one and keep your games. If an older ChessLens is already installed and Android says the app can't be installed, uninstall the old one once.

          Built from ${{ github.ref_name }} @ ${{ github.sha }}."

